<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Task-Window | Contact Customer</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{font-family:Poppins,Arial,sans-serif;background:#f6f8fb}.card{border:0;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.08)}.btn-send{border:0;border-radius:10px;padding:12px 22px;font-weight:600}</style>
</head>
<body>
<nav class="navbar bg-white border-bottom"><div class="container"><a class="navbar-brand fw-bold" href="index.html">Task-Window</a><a href="browse-tasks.html" class="btn btn-outline-secondary">Back to Tasks</a></div></nav>
<main class="container py-5" style="max-width:760px"><div class="card p-4 p-md-5"><h2 class="mb-1">Contact Customer</h2><p class="text-muted mb-4">Send a professional message from Task-Window.</p>
<div id="status" class="mb-3" role="status"></div>
<form id="contactForm"><label class="form-label">Task ID</label><input id="taskId" class="form-control mb-3" required placeholder="Enter task ID"><label class="form-label">Customer Email</label><input id="customerEmail" type="email" class="form-control mb-3" required placeholder="customer@example.com"><label class="form-label">Subject</label><input id="subject" class="form-control mb-3" value="Regarding your Task-Window task" required><label class="form-label">Message</label><textarea id="message" class="form-control mb-4" rows="8" required placeholder="Write your message to the customer..."></textarea><button id="send" class="btn btn-primary btn-send" type="submit">Send Email</button></form></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
const form=document.getElementById('contactForm'),status=document.getElementById('status'),button=document.getElementById('send');
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;status.className='alert alert-info';status.textContent='Sending...';try{const {data:{session}}=await supabaseClient.auth.getSession();if(!session?.user)throw new Error('Please log in first.');const {data,error}=await supabaseClient.functions.invoke('contact-customer',{body:{task_id:document.getElementById('taskId').value.trim(),customer_email:document.getElementById('customerEmail').value.trim(),subject:document.getElementById('subject').value.trim(),message:document.getElementById('message').value.trim()}});if(error)throw error;if(data?.error)throw new Error(data.error);status.className='alert alert-success';status.textContent='Email sent successfully from tasks@task-window.com.';form.reset();document.getElementById('subject').value='Regarding your Task-Window task';}catch(err){console.error(err);status.className='alert alert-danger';status.textContent=err.message||'Unable to send email.'}finally{button.disabled=false}});
</script></body></html>
