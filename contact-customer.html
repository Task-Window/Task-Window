<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Task-Window | Contact Customer</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{font-family:Poppins,Arial,sans-serif;background:#f6f8fb}.card{border:0;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.08)}.btn-send{border:0;border-radius:10px;padding:12px 22px;font-weight:600}.task-info{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:16px}.muted{color:#64748b}</style>
</head>
<body>
<nav class="navbar bg-white border-bottom"><div class="container"><a class="navbar-brand fw-bold" href="index.html">Task-Window</a><a href="browse-tasks.html" class="btn btn-outline-secondary">Back to Tasks</a></div></nav>
<main class="container py-5" style="max-width:760px"><div class="card p-4 p-md-5"><h2 class="mb-1">Contact Customer</h2><p class="text-muted mb-4">Send a message directly from Task-Window. The customer will receive it from <strong>tasks@task-window.com</strong>.</p>
<div id="status" class="mb-3" role="status"></div>
<div id="taskInfo" class="task-info mb-4" style="display:none"></div>
<form id="contactForm"><label class="form-label">Task ID</label><div class="input-group mb-3"><input id="taskId" class="form-control" required placeholder="Enter task ID"><button id="loadTask" class="btn btn-outline-primary" type="button">Load Task</button></div><label class="form-label">Customer Email</label><input id="customerEmail" type="email" class="form-control mb-3" readonly required placeholder="Loaded from task"><label class="form-label">Subject</label><input id="subject" class="form-control mb-3" value="Regarding your Task-Window task" required><label class="form-label">Message</label><textarea id="message" class="form-control mb-4" rows="8" required placeholder="Write your message to the customer..."></textarea><button id="send" class="btn btn-primary btn-send" type="submit" disabled>Send Email</button></form></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
const form=document.getElementById('contactForm'),status=document.getElementById('status'),button=document.getElementById('send'),loadButton=document.getElementById('loadTask'),taskInfo=document.getElementById('taskInfo');
function show(type,text){status.className='alert alert-'+type;status.textContent=text}
async function loadTask(){const taskId=document.getElementById('taskId').value.trim();if(!taskId)return show('warning','Enter a task ID first.');loadButton.disabled=true;show('info','Loading task...');try{const {data:{session}}=await supabaseClient.auth.getSession();if(!session?.user)throw new Error('Please log in first.');const {data,error}=await supabaseClient.functions.invoke('contact-customer',{body:{action:'details',task_id:taskId}});if(error)throw error;if(data?.error)throw new Error(data.error);const t=data.task;if(!t?.customer_email)throw new Error('This task has no customer email.');document.getElementById('customerEmail').value=t.customer_email;document.getElementById('subject').value='Regarding your Task-Window task: '+(t.title||'Your task');taskInfo.style.display='block';taskInfo.innerHTML='<strong>Task #'+t.id+'</strong><br><span>'+escapeHtml(t.title||'')+'</span><br><span class="muted">Customer: '+escapeHtml(t.customer_name||'Customer')+'</span>';button.disabled=false;show('success','Task loaded. You can now write your message.')}catch(err){console.error(err);button.disabled=true;show('danger',err.message||'Unable to load task.')}finally{loadButton.disabled=false}}
function escapeHtml(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
loadButton.addEventListener('click',loadTask);document.getElementById('taskId').addEventListener('change',()=>{button.disabled=true;taskInfo.style.display='none'});
const params=new URLSearchParams(location.search);if(params.get('task_id')){document.getElementById('taskId').value=params.get('task_id');loadTask()}
form.addEventListener('submit',async e=>{e.preventDefault();const taskId=document.getElementById('taskId').value.trim();button.disabled=true;show('info','Sending email...');try{const {data,error}=await supabaseClient.functions.invoke('contact-customer',{body:{task_id:taskId,subject:document.getElementById('subject').value.trim(),message:document.getElementById('message').value.trim()}});if(error)throw error;if(data?.error)throw new Error(data.error);show('success','Email sent successfully from tasks@task-window.com to '+data.to+'.');document.getElementById('message').value='';}catch(err){console.error(err);show('danger',err.message||'Unable to send email.')}finally{button.disabled=false}});
</script></body></html>
