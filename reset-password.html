<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Task-Window</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f6f8fb; }
    .card { width:100%; max-width:440px; border:0; border-radius:18px; box-shadow:0 10px 30px rgba(0,0,0,.08); }
  </style>
</head>
<body>
  <div class="card p-4">
    <h2 class="text-center mb-2">Reset your password</h2>
    <p class="text-center text-muted mb-4">Enter a new password for your Task-Window account.</p>
    <form id="resetPasswordForm">
      <div class="mb-3">
        <label for="newPassword" class="form-label">New password</label>
        <input id="newPassword" type="password" class="form-control" minlength="6" required>
      </div>
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirm password</label>
        <input id="confirmPassword" type="password" class="form-control" minlength="6" required>
      </div>
      <button id="resetButton" class="btn btn-primary w-100" type="submit">Update Password</button>
      <div id="resetMessage" class="mt-3" role="alert"></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const form = document.getElementById('resetPasswordForm');
    const message = document.getElementById('resetMessage');
    const button = document.getElementById('resetButton');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (password !== confirm) {
        message.className = 'mt-3 alert alert-warning';
        message.textContent = 'Passwords do not match.';
        return;
      }

      button.disabled = true;
      message.className = 'mt-3 alert alert-info';
      message.textContent = 'Updating your password...';

      try {
        const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
        if (sessionError || !session) throw new Error('This password reset link is invalid or has expired. Please request a new one.');

        const { error } = await supabaseClient.auth.updateUser({ password });
        if (error) throw error;

        message.className = 'mt-3 alert alert-success';
        message.textContent = 'Password updated successfully. Redirecting to login...';
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
      } catch (error) {
        console.error(error);
        message.className = 'mt-3 alert alert-danger';
        message.textContent = error.message || 'Unable to update your password.';
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
