<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task-Window | Continue to Post a Task</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
body{min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center;background:#f6f8fb;font-family:Poppins,Arial,sans-serif}.choice-card{width:min(92%,760px);background:#fff;border-radius:22px;padding:42px;box-shadow:0 12px 40px rgba(0,0,0,.1);text-align:center}.choice-logo{max-width:150px;max-height:70px;object-fit:contain;margin-bottom:20px}.choice-card h1{font-weight:700;margin-bottom:10px}.choice-card p{color:#667085;margin-bottom:30px}.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.choice{border:1px solid #e5e7eb;border-radius:16px;padding:28px 20px;text-decoration:none;color:inherit;transition:.2s}.choice:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.08)}.choice i{font-size:32px;margin-bottom:14px}.choice h2{font-size:21px;margin-bottom:8px}.choice span{display:block;color:#667085;font-size:14px}.login-choice{background:#0d6efd;color:#fff;border-color:#0d6efd}.login-choice span{color:#e7f0ff}.guest-choice{background:#fff}.back{display:inline-block;margin-top:25px;color:#667085;text-decoration:none}@media(max-width:600px){.choice-card{padding:30px 20px}.choice-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="choice-card">
  <img class="choice-logo" src="assets/task-window-logo.png" alt="Task-Window logo">
  <h1>Before you post a task</h1>
  <p>Choose how you would like to continue.</p>
  <div class="choice-grid">
    <a class="choice login-choice" href="login.html">
      <i class="fa-solid fa-right-to-bracket"></i>
      <h2>Log In</h2>
      <span>Use your Task-Window account and keep your tasks linked to your profile.</span>
    </a>
    <a class="choice guest-choice" href="post-task.html">
      <i class="fa-solid fa-user-clock"></i>
      <h2>Continue as Guest</h2>
      <span>Go directly to the Post Your Task page without creating an account.</span>
    </a>
  </div>
  <a class="back" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
</div>
</body>
</html>
