<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Task-Window | Employee Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f7fb;color:#172033}.topbar{height:68px;background:#fff;border-bottom:1px solid #e7ebf2;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.brand{font-weight:700;font-size:20px}.brand span{color:#2563eb}.employee-badge{font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:#eef4ff;color:#2563eb;margin-left:8px}.wrap{max-width:1250px;margin:0 auto;padding:30px 22px 60px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:25px}.hero h1{margin:0 0 7px;font-size:30px}.muted{color:#667085}.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:600;cursor:pointer}.logout{background:#eef1f6;color:#344054}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}.stat{background:#fff;border:1px solid #e7ebf2;border-radius:14px;padding:18px}.stat strong{display:block;font-size:25px;margin-top:6px}.toolbar{background:#fff;border:1px solid #e7ebf2;border-radius:14px;padding:14px;display:flex;gap:12px;margin-bottom:20px}.toolbar input,.toolbar select{border:1px solid #d8dee9;border-radius:9px;padding:11px 12px;font:inherit;background:#fff}.toolbar input{flex:1}.tasks{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}.card{background:#fff;border:1px solid #e7ebf2;border-radius:15px;padding:20px;box-shadow:0 3px 12px rgba(16,24,40,.04)}.card h2{font-size:19px;margin:0 0 8px}.meta{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.pill{padding:5px 9px;border-radius:999px;background:#f1f4f8;font-size:12px;font-weight:600}.status{background:#eaf7ef;color:#16834b}.attachment{margin-top:16px;padding:13px;border-radius:10px;background:#f7f9fc;border:1px solid #e6eaf0}.attachment a{display:inline-block;margin-top:9px;text-decoration:none;color:#2563eb;font-weight:600}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.primary{background:#2563eb;color:#fff}.success{background:#16834b;color:#fff}.customer{font-size:13px;color:#475467}.empty{grid-column:1/-1;text-align:center;padding:50px;background:#fff;border:1px dashed #cdd5df;border-radius:15px}.message{margin-bottom:18px;color:#667085}.login-page{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(430px,100%);background:#fff;border:1px solid #e7ebf2;border-radius:18px;padding:30px;box-shadow:0 10px 35px rgba(16,24,40,.08)}.login h1{margin-top:0}.login input{width:100%;padding:12px;border:1px solid #d8dee9;border-radius:9px;margin:7px 0 16px;font:inherit}.login button{width:100%;background:#2563eb;color:#fff}.error{color:#b42318;margin-top:12px;min-height:20px;font-size:14px}.hidden{display:none!important}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.hero{align-items:flex-start;flex-direction:column}.toolbar{flex-direction:column}}@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.topbar{padding:0 16px}.wrap{padding:22px 14px}.tasks{grid-template-columns:1fr}}
</style>
</head>
<body>
<section id="loginPage" class="login-page">
  <div class="login">
    <div class="brand">Task-<span>Window</span></div>
    <h1>Employee Portal</h1>
    <p class="muted">Private access for Task-Window employees.</p>
    <form id="loginForm">
      <label>Email</label><input id="email" type="email" autocomplete="username" required>
      <label>Password</label><input id="password" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">Sign in to Employee Portal</button>
    </form>
    <div id="loginMessage" class="error"></div>
  </div>
</section>

<section id="app" class="hidden">
<header class="topbar"><div class="brand">Task-<span>Window</span><span class="employee-badge">EMPLOYEE</span></div><button id="logout" class="btn logout">Log out</button></header>
<main class="wrap">
  <div class="hero"><div><h1>Employee Dashboard</h1><div class="muted">Manage customer requests and their uploaded documents.</div></div></div>
  <div class="stats"><div class="stat"><div class="muted">All tasks</div><strong id="allCount">0</strong></div><div class="stat"><div class="muted">Open</div><strong id="openCount">0</strong></div><div class="stat"><div class="muted">In progress</div><strong id="progressCount">0</strong></div><div class="stat"><div class="muted">Completed</div><strong id="completedCount">0</strong></div></div>
  <div id="message" class="message">Loading customer tasks...</div>
  <div class="toolbar"><input id="search" placeholder="Search task, customer or category..."><select id="statusFilter"><option value="all">All statuses</option><option value="open">Open</option><option value="in_progress">In progress</option><option value="completed">Completed</option></select><select id="sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></div>
  <section id="tasks" class="tasks"></section>
</main>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script>
const loginPage=document.getElementById('loginPage'),app=document.getElementById('app'),tasksEl=document.getElementById('tasks'),message=document.getElementById('message'),loginMessage=document.getElementById('loginMessage');
let allTasks=[];
const esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
function fmtDate(v){if(!v)return 'Not specified';const d=new Date(v+'T00:00:00');return Number.isNaN(d.getTime())?esc(v):d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});}
function updateStats(){document.getElementById('allCount').textContent=allTasks.length;document.getElementById('openCount').textContent=allTasks.filter(t=>t.status==='open').length;document.getElementById('progressCount').textContent=allTasks.filter(t=>t.status==='in_progress').length;document.getElementById('completedCount').textContent=allTasks.filter(t=>t.status==='completed').length;}
async function start(){const {data:{session}}=await supabaseClient.auth.getSession();if(session) await enter(session);}
async function enter(session){const role=session.user?.user_metadata?.role;if(role!=='employee'&&role!=='admin'){loginMessage.textContent='This account is not authorized for the employee portal.';await supabaseClient.auth.signOut();return}loginPage.classList.add('hidden');app.classList.remove('hidden');await loadTasks();}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();loginMessage.textContent='Signing in...';const {data,error}=await supabaseClient.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){loginMessage.textContent=error.message;return}await enter(data.session)});
document.getElementById('logout').onclick=async()=>{await supabaseClient.auth.signOut();location.reload()};
document.getElementById('search').oninput=render;document.getElementById('statusFilter').onchange=render;document.getElementById('sort').onchange=render;
async function loadTasks(){message.textContent='Loading customer tasks...';const {data,error}=await supabaseClient.from('tasks').select('id,title,category,description,budget,estimated_time,deadline,status,customer_name,customer_email,customer_phone,attachment_path,attachment_name,created_at').order('created_at',{ascending:false});if(error){message.textContent='Unable to load tasks: '+error.message;return}allTasks=data||[];updateStats();render();}
async function render(){const q=document.getElementById('search').value.trim().toLowerCase();const filter=document.getElementById('statusFilter').value;const sort=document.getElementById('sort').value;let rows=allTasks.filter(t=>filter==='all'||t.status===filter).filter(t=>!q||[t.title,t.category,t.description,t.customer_name,t.customer_email].some(v=>String(v||'').toLowerCase().includes(q)));rows.sort((a,b)=>sort==='newest'?new Date(b.created_at)-new Date(a.created_at):new Date(a.created_at)-new Date(b.created_at));message.textContent=rows.length?`${rows.length} task${rows.length===1?'':'s'} shown`:'No matching customer tasks.';tasksEl.innerHTML='';for(const t of rows){const c=document.createElement('article');c.className='card';let attachment='';if(t.attachment_path){const r=await supabaseClient.storage.from('task-attachments').createSignedUrl(t.attachment_path,3600);attachment=r.data?.signedUrl?`<div class="attachment">📎 <strong>${esc(t.attachment_name||'Document')}</strong><br><a href="${r.data.signedUrl}" target="_blank" rel="noopener">View / Download document ↗</a></div>`:`<div class="attachment">📎 ${esc(t.attachment_name||'Document')}<br><span class="muted">Document unavailable.</span></div>`}
const statusLabel=t.status==='in_progress'?'In progress':t.status==='completed'?'Completed':'Open';
c.innerHTML=`<h2>${esc(t.title||'Untitled task')}</h2><div class="customer">Customer: <strong>${esc(t.customer_name||'Not provided')}</strong> · ${esc(t.customer_email||'No email')}</div><div class="meta"><span class="pill">${esc(t.category||'Uncategorized')}</span><span class="pill">₹${esc(t.budget)}</span><span class="pill status">${statusLabel}</span></div><p>${esc(t.description||'No description provided.')}</p><p class="customer"><strong>Deadline:</strong> ${fmtDate(t.deadline)} · <strong>Estimated:</strong> ${esc(t.estimated_time||'Not specified')}</p>${attachment}<div class="actions"><button class="btn primary" data-id="${esc(t.id)}" data-status="in_progress">Start task</button><button class="btn success" data-id="${esc(t.id)}" data-status="completed">Mark completed</button>${t.customer_email?`<a class="btn logout" href="mailto:${esc(t.customer_email)}?subject=${encodeURIComponent('Task-Window: '+(t.title||'Your task'))}">Email customer</a>`:''}</div>`;tasksEl.appendChild(c)}tasksEl.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>updateStatus(b.dataset.id,b.dataset.status));}
async function updateStatus(id,status){const {error}=await supabaseClient.from('tasks').update({status}).eq('id',id);if(error){alert('Unable to update task: '+error.message);return}const t=allTasks.find(x=>String(x.id)===String(id));if(t)t.status=status;updateStats();render();}
start();
</script>
</body>
</html>
