<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Task-Window | Employee Portal</title><link rel="stylesheet" href="../style.css"><style>body{background:#f8fafc}.portal{max-width:1200px;margin:50px auto;padding:0 20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:24px;margin:18px 0;box-shadow:0 4px 14px rgba(0,0,0,.05)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}.muted{color:#64748b}.btn{display:inline-block;padding:10px 14px;border-radius:8px;text-decoration:none;border:0;cursor:pointer;margin:4px}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}.status{font-weight:700}.attachment{margin-top:14px;padding:12px;background:#f1f5f9;border-radius:9px}.hidden{display:none}.login{max-width:480px;margin:80px auto;padding:30px;background:#fff;border-radius:16px}.login input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0 14px;border:1px solid #d1d5db;border-radius:8px}.message{margin-top:12px;color:#b91c1c}</style></head>
<body><main class="portal"><section id="loginBox" class="login"><h1>Employee Portal</h1><p class="muted">Sign in to manage customer tasks.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button class="btn primary" type="submit">Employee Login</button></form><p id="loginMessage" class="message"></p></section>
<section id="dashboard" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap"><div><h1>Employee Dashboard</h1><p class="muted">Private customer tasks and uploaded documents</p></div><button id="logout" class="btn secondary">Log out</button></div><div id="message" class="muted"></div><div id="tasks" class="grid"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script>
const loginBox=document.getElementById('loginBox'),dashboard=document.getElementById('dashboard'),tasksEl=document.getElementById('tasks'),message=document.getElementById('message'),loginMessage=document.getElementById('loginMessage');
const esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
async function start(){const{data:{session}}=await supabaseClient.auth.getSession();if(session) await enter(session);}
async function enter(session){const role=session.user?.user_metadata?.role;if(role!=='employee'&&role!=='admin'){loginMessage.textContent='This account is not authorized for the employee portal.';await supabaseClient.auth.signOut();return}loginBox.classList.add('hidden');dashboard.classList.remove('hidden');await loadTasks();}
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();loginMessage.textContent='Signing in...';const{data,error}=await supabaseClient.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){loginMessage.textContent=error.message;return}await enter(data.session)};
document.getElementById('logout').onclick=async()=>{await supabaseClient.auth.signOut();location.reload()};
async function loadTasks(){message.textContent='Loading customer tasks...';const{data,error}=await supabaseClient.from('tasks').select('id,title,category,description,budget,estimated_time,deadline,status,customer_email,attachment_path,attachment_name,created_at').order('created_at',{ascending:false});if(error){message.textContent='Unable to load tasks: '+error.message;return}message.textContent=data?.length?data.length+' task(s)':'No customer tasks yet.';tasksEl.innerHTML='';for(const t of data||[]){const c=document.createElement('article');c.className='card';let attachment='';if(t.attachment_path){const r=await supabaseClient.storage.from('task-attachments').createSignedUrl(t.attachment_path,3600);attachment=r.data?.signedUrl?`<div class="attachment">📎 <strong>${esc(t.attachment_name||'Document')}</strong><br><a class="btn secondary" href="${r.data.signedUrl}" target="_blank" rel="noopener">View / Download</a></div>`:`<div class="attachment">📎 ${esc(t.attachment_name||'Document')}<br><span class="muted">Document unavailable.</span></div>`}c.innerHTML=`<h2>${esc(t.title)}</h2><p>${esc(t.description)}</p><p><b>Category:</b> ${esc(t.category)} &nbsp; <b>Budget:</b> ₹${esc(t.budget)}</p><p><b>Deadline:</b> ${esc(t.deadline)} &nbsp; <b>Status:</b> <span class="status">${esc(t.status)}</span></p><p><b>Customer:</b> ${esc(t.customer_email||'Not provided')}</p>${attachment}<div><button class="btn primary" data-id="${esc(t.id)}" data-status="in_progress">Start Task</button><button class="btn secondary" data-id="${esc(t.id)}" data-status="completed">Mark Completed</button></div>`;tasksEl.appendChild(c)}tasksEl.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>updateStatus(b.dataset.id,b.dataset.status));}
async function updateStatus(id,status){const{error}=await supabaseClient.from('tasks').update({status}).eq('id',id);if(error){alert(error.message);return}await loadTasks()}
start();
</script></body></html>
